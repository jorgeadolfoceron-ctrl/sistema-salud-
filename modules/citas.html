<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citas</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Gestión de Citas</h1>
        <button id="logoutBtn" style="background-color:#dc3545;margin-bottom:15px;">Cerrar sesión</button>
        <form id="appointmentForm">
            <input type="text" id="patientName" placeholder="Nombre del paciente" required>
            <input type="datetime-local" id="appointmentDate" required>
            <button type="submit">Agregar Cita</button>
        </form>
        <h2>Lista de Citas</h2>
        <ul id="appointmentList"></ul>
        <a href="pacientes.html">Ir a Pacientes</a>
    </div>
    <script src="../js/app.js"></script>
</body>
</html>
